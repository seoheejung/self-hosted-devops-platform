name: Deploy GitLab to Mini PC

on:
  push:
    branches:
      # main 브랜치에 push 또는 PR merge될 때 배포 실행
      - main
    paths:
      # GitLab Docker Compose 파일이 변경된 경우에만 실행
      - "infra/compose/docker-compose.gitlab.yml"

      # 배포 Workflow 자체가 변경된 경우에도 실행
      - ".github/workflows/deploy-gitlab.yml"

  # 문서만 변경된 경우에도 필요 시 수동으로 배포/검증 실행
  workflow_dispatch:

jobs:
  deploy:
    # Mini PC WSL2 Ubuntu에 등록한 GitHub self-hosted runner에서 실행
    # GitHub-hosted runner가 아니므로 내부망 SSH 접속이 필요 없음
    runs-on: self-hosted

    steps:
      # GitHub Repository 내용을 self-hosted runner 작업 디렉토리로 checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # GitLab Container가 사용할 운영 데이터 디렉토리 생성
      # GitHub Actions workspace 밖의 고정 경로를 사용해 checkout 정리와 무관하게 데이터 유지
      #
      # /home/gali/gitlab/config : GitLab 설정 파일
      # /home/gali/gitlab/data   : Repository, DB, 업로드 파일 등 실제 데이터
      # /home/gali/gitlab/logs   : GitLab 로그
      - name: Prepare GitLab volume directories
        run: |
          mkdir -p /home/gali/gitlab/config
          mkdir -p /home/gali/gitlab/data
          mkdir -p /home/gali/gitlab/logs

      # Docker Desktop credential helper가 GitHub Actions runner 세션에서 실패하는 문제 방지
      # GitLab CE public image pull에는 Docker Hub 인증이 필요하지 않으므로 credential store를 사용하지 않음
      - name: Reset Docker credential config
        run: |
          mkdir -p ~/.docker
          cat > ~/.docker/config.json <<'EOF'
          {
            "auths": {}
          }
          EOF

      # 8080 포트 사전 조건 확인
      #
      # 8080 예약 해제는 GitHub Actions 안에서 처리하지 않는다.
      # WinNAT을 Actions Job 내부에서 중지하면 self-hosted runner의 GitHub 연결이 끊길 수 있다.
      #
      # 8080 예약 해제는 Windows Scheduled Task에서 실행하는
      # D:\DEV\prepare-github-runner.ps1 이 담당한다.
      #
      # 이 step은 현재 runner 실행 환경에서 8080이 Windows excluded port range에 남아 있는지만 확인한다.
      # 남아 있으면 배포 전에 실패시켜 원인을 명확히 한다.
      - name: Verify Windows port 8080 is available
        shell: bash
        run: |
          set -euo pipefail

          TARGET_PORT=8080

          echo "Checking Windows excluded TCP port ranges..."
          RANGES_RAW=$(timeout 30s cmd.exe /c "netsh interface ipv4 show excludedportrange protocol=tcp")
          RANGES=$(printf "%s" "$RANGES_RAW" | tr -d '\r')

          echo "$RANGES"

          MATCHED_RANGE=$(printf "%s\n" "$RANGES" | awk -v port="$TARGET_PORT" '
            $1 ~ /^[0-9]+$/ && $2 ~ /^[0-9]+$/ {
              start=$1
              end=$2

              if (port >= start && port <= end) {
                print start " " end
                exit
              }
            }
          ')

          if [ -n "$MATCHED_RANGE" ]; then
            echo "Port ${TARGET_PORT} is still reserved in Windows excluded port range: ${MATCHED_RANGE}"
            echo "Run D:\\DEV\\prepare-github-runner.ps1 through the scheduled task before running this workflow."
            exit 1
          fi

          echo "Port ${TARGET_PORT} is not reserved by Windows excluded port range."

      # Mini PC WSL2 Ubuntu 내부에서 Docker Compose로 GitLab Container 실행
      #
      # 기존 gitlab Container가 Created / Exited / 잘못된 port publish 상태로 남아 있을 수 있으므로
      # 배포 전에 기존 gitlab Container를 먼저 제거한다.
      #
      # docker rm -f gitlab:
      #   기존 gitlab Container 제거
      #   /home/gali/gitlab 하위 bind mount 데이터는 삭제하지 않음
      #
      # docker compose up -d:
      #   docker-compose.gitlab.yml 정의 기준으로 GitLab Container 재생성
      #
      # --remove-orphans:
      #   현재 Compose 파일에 없는 orphan Container 정리
      #
      # MINI_PC_HOST:
      #   GitLab external_url에 사용할 Mini PC 내부 IP
      #
      # docker ps:
      #   컨테이너 실행 상태 확인
      #
      # docker port gitlab:
      #   GitLab Container의 Host Port publish 상태 확인
      - name: Deploy GitLab container
        env:
          MINI_PC_HOST: ${{ secrets.MINI_PC_HOST }}
        run: |
          docker rm -f gitlab || true
          docker compose -f infra/compose/docker-compose.gitlab.yml up -d --remove-orphans
          docker ps
          docker port gitlab

      # GitLab Web UI 접근용 Host 8080 → Container 80 포트 publish 확인
      #
      # 정상 기준:
      #   docker port gitlab 80
      #   0.0.0.0:8080
      #
      # GitLab 부팅 중에는 curl 결과가 502일 수 있으므로,
      # 여기서는 curl 실패를 즉시 실패 처리하지 않고 로그만 남긴다.
      - name: Verify GitLab published ports
        run: |
          docker port gitlab

          if ! docker port gitlab 80 | grep -q ":8080"; then
            echo "GitLab HTTP port 8080 is not published"
            exit 1
          fi

          curl -I --max-time 10 http://127.0.0.1:8080 || true

      # GitLab Container 재배포 후 runtime volume이 기존 고정 경로를 유지하는지 확인
      #
      # 이 검증은 GitLab 재시작 후 프로젝트 / Runner 정보가 사라지는 문제를 방지하기 위한 확인 단계
      #
      # 정상 기준:
      #   /home/gali/gitlab/config → /etc/gitlab
      #   /home/gali/gitlab/logs   → /var/log/gitlab
      #   /home/gali/gitlab/data   → /var/opt/gitlab
      - name: Verify GitLab volume mounts
        run: |
          docker inspect gitlab --format '{{json .Mounts}}' | python3 -m json.tool

      # GitLab 주요 서비스가 정상 기동될 때까지 대기
      #
      # GitLab은 Container 시작 직후 runsv not running 상태가 잠시 발생할 수 있음
      # puma / postgresql / sidekiq / nginx가 run 상태가 될 때까지 최대 5분 대기
      - name: Wait for GitLab services
        run: |
          for i in {1..30}; do
            if docker exec gitlab gitlab-ctl status | grep -q "run: puma" && \
               docker exec gitlab gitlab-ctl status | grep -q "run: postgresql" && \
               docker exec gitlab gitlab-ctl status | grep -q "run: sidekiq" && \
               docker exec gitlab gitlab-ctl status | grep -q "run: nginx"; then
              echo "GitLab core services are running"
              exit 0
            fi

            echo "Waiting for GitLab services... ($i/30)"
            sleep 10
          done

          docker exec gitlab gitlab-ctl status
          exit 1

      # GitLab DB 기준으로 Phase 4에서 생성한 테스트 프로젝트와 Runner 등록 정보가 유지되는지 확인
      #
      # projects=0:
      #   GitLab 프로젝트 데이터가 사라졌거나 다른 volume을 보고 있을 가능성
      #
      # runners=0:
      #   GitLab Runner 등록 정보가 사라졌거나 GitLab DB가 초기화되었을 가능성
      #
      # 정상 기준:
      #   PROJECT_COUNT >= 1
      #   RUNNER_COUNT >= 1
      - name: Verify GitLab persistent data
        run: |
          docker exec gitlab gitlab-rails runner "puts \"projects=#{Project.count}\"; Project.order(:id).each { |p| puts \"#{p.id} #{p.full_path}\" }"

          docker exec gitlab gitlab-rails runner "puts \"runners=#{Ci::Runner.count}\"; Ci::Runner.order(:id).each { |r| puts \"#{r.id} #{r.description} active=#{r.active}\" }"

          PROJECT_COUNT=$(docker exec gitlab gitlab-rails runner "puts Project.count" | tail -n 1)
          RUNNER_COUNT=$(docker exec gitlab gitlab-rails runner "puts Ci::Runner.count" | tail -n 1)

          echo "PROJECT_COUNT=${PROJECT_COUNT}"
          echo "RUNNER_COUNT=${RUNNER_COUNT}"

          if [ "${PROJECT_COUNT}" -lt 1 ]; then
            echo "GitLab project data is missing"
            exit 1
          fi

          if [ "${RUNNER_COUNT}" -lt 1 ]; then
            echo "GitLab runner registration data is missing"
            exit 1
          fi