name: Deploy Monitoring Stack

on:
  push:
    branches:
      # main 브랜치에 push 또는 PR merge될 때 Monitoring 배포 실행
      - main
    paths:
      # Monitoring Compose 파일이 변경된 경우 배포 실행
      - "infra/compose/docker-compose.monitoring.yml"

      # Prometheus / Grafana 설정 파일이 변경된 경우 배포 실행
      - "infra/monitoring/**"

      # Monitoring 배포 Workflow 자체가 변경된 경우에도 실행
      - ".github/workflows/deploy-monitoring.yml"

  # 문서 변경 또는 수동 검증이 필요한 경우 직접 실행
  workflow_dispatch:

jobs:
  deploy-monitoring:
    # Mini PC WSL2 Ubuntu에 등록한 GitHub self-hosted runner에서 실행
    # GitHub-hosted runner가 아니므로 내부망 IP와 Docker Desktop 접근이 가능하다.
    name: Deploy Prometheus and Grafana
    runs-on: self-hosted

    steps:
      # GitHub Repository 내용을 self-hosted runner 작업 디렉토리로 checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # Monitoring runtime 파일 준비
      #
      # GitHub Repository의 infra/monitoring/ 하위 파일은 원본 설정 파일이다.
      # 실제 Prometheus / Grafana Container에는 Mini PC 고정 경로인 /home/gali/monitoring 을 mount한다.
      #
      # GitHub Actions workspace 경로를 직접 mount하지 않는 이유:
      #   GitHub Actions workspace는 checkout / cleanup / runner 작업 상태에 따라 달라질 수 있음
      #   Monitoring runtime 파일은 Mini PC WSL2 내부 고정 경로에 두는 것이 운영상 안정적임
      #
      # 생성 / 복사 대상:
      #   /home/gali/monitoring/prometheus/prometheus.yml
      #   /home/gali/monitoring/grafana/provisioning/datasources/datasource.yml
      #   /home/gali/monitoring/grafana/provisioning/dashboards/dashboards.yml
      #   /home/gali/monitoring/grafana/dashboards/mini-pc-devops-overview.json
      #
      # Dashboard JSON:
      #   초기에는 파일이 없을 수 있으므로 존재할 때만 복사한다.
      #   Grafana UI에서 Dashboard 작성 후 export하여 Repository에 저장한다.
      - name: Prepare Monitoring runtime files
        run: |
          mkdir -p /home/gali/monitoring/prometheus
          mkdir -p /home/gali/monitoring/grafana/provisioning/datasources
          mkdir -p /home/gali/monitoring/grafana/provisioning/dashboards
          mkdir -p /home/gali/monitoring/grafana/dashboards

          cp infra/monitoring/prometheus/prometheus.yml \
            /home/gali/monitoring/prometheus/prometheus.yml

          cp infra/monitoring/grafana/provisioning/datasources/datasource.yml \
            /home/gali/monitoring/grafana/provisioning/datasources/datasource.yml

          cp infra/monitoring/grafana/provisioning/dashboards/dashboards.yml \
            /home/gali/monitoring/grafana/provisioning/dashboards/dashboards.yml

          if [ -f infra/monitoring/grafana/dashboards/mini-pc-devops-overview.json ]; then
            cp infra/monitoring/grafana/dashboards/mini-pc-devops-overview.json \
              /home/gali/monitoring/grafana/dashboards/mini-pc-devops-overview.json
          fi

          ls -R /home/gali/monitoring

      # Monitoring Compose 설정 검증
      #
      # docker compose config:
      #   Compose 파일 문법, volume mount, port publish, service 정의를 검증한다.
      #
      # -p monitoring:
      #   GitLab Compose와 Monitoring Compose가 같은 infra/compose 디렉토리에 있으므로
      #   기본 project name이 겹치지 않도록 Monitoring 전용 project name을 명시한다.
      #
      # 정상 기준:
      #   prometheus service 출력
      #   grafana service 출력
      #   prometheus-data volume 출력
      #   grafana-data volume 출력
      - name: Validate Monitoring compose config
        run: |
          docker compose -p monitoring -f infra/compose/docker-compose.monitoring.yml config

      # Prometheus / Grafana Container 배포
      #
      # 기존 Monitoring Container가 Created / Exited / 잘못된 port publish 상태로
      # 남아 있을 수 있으므로 배포 전에 기존 Container를 제거한다.
      #
      # docker rm -f gitlab-prometheus:
      #   기존 Prometheus Container 제거
      #   prometheus-data named volume은 삭제하지 않음
      #
      # docker rm -f gitlab-grafana:
      #   기존 Grafana Container 제거
      #   grafana-data named volume은 삭제하지 않음
      #
      # docker compose up -d:
      #   docker-compose.monitoring.yml 정의 기준으로 Prometheus / Grafana Container 생성
      #
      # -p monitoring:
      #   GitLab Compose project와 분리하기 위한 Monitoring 전용 project name
      #
      # --remove-orphans:
      #   monitoring project 기준으로 현재 Compose 파일에 없는 orphan Container 정리
      #
      # docker ps:
      #   컨테이너 실행 상태 확인
      #
      # docker port gitlab-prometheus:
      #   Prometheus 9090 포트 publish 상태 확인
      #
      # docker port gitlab-grafana:
      #   Grafana 3000 포트 publish 상태 확인
      - name: Deploy Monitoring containers
        run: |
          docker rm -f gitlab-prometheus || true
          docker rm -f gitlab-grafana || true
          docker compose -p monitoring -f infra/compose/docker-compose.monitoring.yml up -d --remove-orphans
          docker ps
          docker port gitlab-prometheus
          docker port gitlab-grafana

      # Prometheus 접근용 Host 9090 → Container 9090 포트 publish 확인
      #
      # 정상 기준:
      #   docker port gitlab-prometheus 9090
      #   0.0.0.0:9090
      #
      # Main PC 접근 주소:
      #   http://172.30.1.67:9090
      - name: Verify Prometheus published port
        run: |
          docker port gitlab-prometheus

          if ! docker port gitlab-prometheus 9090 | grep -q ":9090"; then
            echo "Prometheus port 9090 is not published"
            exit 1
          fi

      # Grafana 접근용 Host 3000 → Container 3000 포트 publish 확인
      #
      # 정상 기준:
      #   docker port gitlab-grafana 3000
      #   0.0.0.0:3000
      #
      # Main PC 접근 주소:
      #   http://172.30.1.67:3000
      - name: Verify Grafana published port
        run: |
          docker port gitlab-grafana

          if ! docker port gitlab-grafana 3000 | grep -q ":3000"; then
            echo "Grafana port 3000 is not published"
            exit 1
          fi

      # Prometheus HTTP readiness 확인
      #
      # localhost 기준으로 self-hosted runner에서 Prometheus Container publish port에 접근한다.
      #
      # 정상 기준:
      #   HTTP 200 응답
      #
      # 실패 시 확인 대상:
      #   prometheus.yml 문법
      #   /home/gali/monitoring/prometheus/prometheus.yml mount 여부
      #   gitlab-prometheus Container 로그
      - name: Verify Prometheus HTTP endpoint
        run: |
          curl -f -I --max-time 10 http://127.0.0.1:9090/-/ready

      # Grafana HTTP health 확인
      #
      # localhost 기준으로 self-hosted runner에서 Grafana Container publish port에 접근한다.
      #
      # 정상 기준:
      #   HTTP 200 응답
      #
      # 실패 시 확인 대상:
      #   Grafana provisioning mount 경로
      #   grafana-data volume 상태
      #   gitlab-grafana Container 로그
      - name: Verify Grafana HTTP endpoint
        run: |
          curl -f -I --max-time 10 http://127.0.0.1:3000/api/health