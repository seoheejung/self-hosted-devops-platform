services:
  gitlab:
    # GitLab Community Edition Omnibus 이미지
    image: gitlab/gitlab-ce:18.11.2-ce.0

    # 컨테이너 이름 고정
    container_name: gitlab

    # 컨테이너 중지 시 수동 중지가 아니면 자동 재시작
    restart: unless-stopped

    # GitLab 내부 hostname
    hostname: gitlab.local

    # GitLab 권장 공유 메모리 설정
    shm_size: "256m"

    # Host Port : Container Port
    ports:
      - "8080:80"    # 복구 경로: Main PC에서 기존 방식으로 GitLab Web UI 접근
      - "2222:22"    # GitLab Repository SSH 접속용 포트

    environment:
      # GitLab Omnibus 설정
      GITLAB_OMNIBUS_CONFIG: |
        # 기존 복구 경로 유지
        # MINI_PC_HOST는 GitHub Actions Secret에서 주입
        external_url 'http://${MINI_PC_HOST}:8080'

        # Compose 포트 매핑은 Host 8080 → Container 80 구조이므로
        # GitLab 내부 Nginx는 80번 포트로 고정한다.
        nginx['listen_port'] = 80
        nginx['listen_https'] = false

        # GitLab Repository SSH 접속 포트
        # Host 2222 → Container 22 포트 매핑과 일치시킨다.
        gitlab_rails['gitlab_shell_ssh_port'] = 2222

        # Mini PC 리소스 절약을 위한 GitLab 프로세스 튜닝
        puma['worker_processes'] = 1
        sidekiq['concurrency'] = 5
        postgresql['shared_buffers'] = "256MB"

    # GitLab 데이터 영속화 볼륨
    # GitHub Actions workspace가 아니라 Mini PC WSL2 내부 고정 경로 사용
    volumes:
      - /home/gali/gitlab/config:/etc/gitlab      # GitLab 설정 파일
      - /home/gali/gitlab/logs:/var/log/gitlab    # GitLab 로그 파일
      - /home/gali/gitlab/data:/var/opt/gitlab    # GitLab Repository, DB, 업로드 데이터

  nginx:
    # GitLab 앞단 Reverse Proxy용 Nginx
    image: nginx:stable-alpine

    # 컨테이너 이름 고정
    container_name: gitlab-nginx

    # 컨테이너 중지 시 수동 중지가 아니면 자동 재시작
    restart: unless-stopped

    # Host Port : Container Port
    ports:
      - "80:80"      # http://gitlab.local 접근 후 HTTPS로 redirect
      - "443:443"    # https://gitlab.local 접근

    # Nginx 설정 파일 및 SSL 인증서 mount
    # GitHub Actions workspace가 아니라 Mini PC WSL2 내부 고정 runtime 경로 사용
    # GitHub Repository의 nginx/ 설정 파일은 workflow에서 /home/gali/nginx/ 로 복사한다.
    volumes:
      - /home/gali/nginx/nginx.conf:/etc/nginx/nginx.conf:ro      # Nginx 전역 설정
      - /home/gali/nginx/conf.d:/etc/nginx/conf.d:ro              # GitLab reverse proxy server block
      - /home/gali/nginx/ssl:/etc/nginx/ssl:ro                    # SSL 인증서 / private key

    # GitLab 컨테이너 생성 이후 Nginx 생성
    # 단, GitLab application readiness까지 보장하지는 않는다.
    depends_on:
      - gitlab