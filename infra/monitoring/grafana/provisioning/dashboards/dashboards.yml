apiVersion: 1

providers:
  # Mini PC DevOps Dashboard provider
  # /var/lib/grafana/dashboards 경로의 JSON 파일을 읽어 Grafana Dashboard로 등록
  - name: Mini PC DevOps

    # 기본 organization ID
    orgId: 1

    # Grafana UI에서 표시될 dashboard folder 이름
    folder: Mini PC DevOps

    # file provider 사용
    type: file

    # false로 두면 파일 기준으로 dashboard 삭제 반영
    disableDeletion: false

    # dashboard JSON 변경 감지 주기
    updateIntervalSeconds: 30

    # UI에서 dashboard 수정 허용 
    # 수정 후 export하여 Repository에 반영하는 흐름으로 사용
    allowUiUpdates: true

    options:
      # Grafana Container 내부 dashboard JSON 경로
      path: /var/lib/grafana/dashboards