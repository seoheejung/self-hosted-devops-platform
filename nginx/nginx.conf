# Nginx master process 실행 사용자
user nginx;

# Worker process 수
# auto는 컨테이너가 사용 가능한 CPU에 맞춰 자동 조정
worker_processes auto;

# Nginx 에러 로그 경로와 로그 레벨
error_log /var/log/nginx/error.log warn;

# Nginx master process PID 파일 위치
pid /var/run/nginx.pid;

events {
    # worker process 하나가 동시에 처리할 수 있는 최대 connection 수
    worker_connections 1024;
}

http {
    # MIME type 매핑 파일 로드
    include /etc/nginx/mime.types;

    # MIME type을 알 수 없는 파일의 기본 Content-Type
    default_type application/octet-stream;

    # 기본 access log 포맷
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # access log 출력 위치와 포맷
    access_log /var/log/nginx/access.log main;

    # 파일 전송 최적화
    sendfile on;

    # keep-alive 연결 유지 시간
    keepalive_timeout 65;

    # 개별 server block 설정 로드
    #
    # GitLab Reverse Proxy 설정은 /etc/nginx/conf.d/gitlab.conf 에서 관리
    include /etc/nginx/conf.d/*.conf;
}