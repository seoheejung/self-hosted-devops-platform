# HTTP 요청을 HTTPS로 강제 전환
#
# 사용자가 브라우저에서 http://gitlab.local 로 접근해도
# 최종 접근 경로는 https://gitlab.local 이 되도록 301 redirect 반환.
server {
    listen 80;
    server_name gitlab.local;

    return 301 https://$host$request_uri;
}

# HTTPS 기반 GitLab Reverse Proxy 서버 설정
#
# 외부 클라이언트(Main PC)는 https://gitlab.local 로 접근하고,
# Nginx는 같은 Docker Compose 네트워크 안의 GitLab Container로 HTTP 요청 전달
server {
    listen 443 ssl;
    server_name gitlab.local;

    # 자체 서명 인증서 경로
    #
    # docker-compose.gitlab.yml에서 해당 mount 사용
    #   ../../nginx/ssl:/etc/nginx/ssl:ro
    #
    # 실제 인증서 파일은 Mini PC의 /home/gali/nginx/ssl/ 하위에 생성
    ssl_certificate /etc/nginx/ssl/gitlab.local.crt;
    ssl_certificate_key /etc/nginx/ssl/gitlab.local.key;

    # GitLab은 Repository push, artifact, attachment, import 등으로
    # 큰 요청 body가 들어올 수 있으므로 업로드 제한 해제
    client_max_body_size 0;

    location / {
        # 같은 Docker Compose 네트워크 안의 GitLab service로 요청 전달
        #
        # 이 값이 동작하려면 docker-compose.gitlab.yml의 service 이름이 gitlab 필수
        proxy_pass http://gitlab:80;

        # 원본 Host 헤더를 GitLab에 전달
        #
        # GitLab은 Host 값을 기준으로 redirect URL, Web UI 링크, clone URL 등 판단 가능
        proxy_set_header Host $host;

        # 실제 클라이언트 IP를 GitLab에 전달
        #
        # X-Real-IP:
        #   현재 요청의 직접 클라이언트 IP
        #
        # X-Forwarded-For:
        #   Proxy 체인을 고려한 클라이언트 IP 목록
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 외부 사용자가 HTTPS로 접근했다는 사실을 GitLab에 전달
        #
        # Nginx에서 TLS를 종료하고 GitLab Container로는 HTTP로 전달하므로,
        # 이 header가 없으면 GitLab이 외부 요청을 HTTP로 인식 가능
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;

        # WebSocket 또는 long polling 요청을 위해 HTTP/1.1 upgrade header 전달
        #
        # GitLab Web UI 일부 기능은 장시간 연결이나 upgrade header 필요
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # GitLab 화면 로딩, Git 작업, 대용량 요청에서 timeout이 짧아 요청이 끊기는 것 방지
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;

        # GitLab이 반환한 redirect를 Nginx가 임의로 변경 불가 지정
        proxy_redirect off;
    }
}